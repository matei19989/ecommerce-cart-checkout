<div class="min-h-screen flex items-center justify-center bg-white px-4">
  <div class="w-full max-w-sm p-10">
    <h2 class="text-3xl font-extralight tracking-tight text-neutral-900 mb-2">Create Account</h2>
    <p class="text-sm text-neutral-500 mb-10">Fill in your details to get started.</p>
    @if (error) {
      <div class="text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded-sm px-4 py-2.5 mb-6">{{ error }}</div>
    }
    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="name" class="block text-xs font-medium uppercase tracking-widest text-neutral-500 mb-2">Name</label>
        <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Name" required
          class="w-full px-0 py-3 bg-transparent border-b border-neutral-300 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-amber-500 transition-colors" />
      </div>
      <div>
        <label for="email" class="block text-xs font-medium uppercase tracking-widest text-neutral-500 mb-2">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="Email Address" required
          class="w-full px-0 py-3 bg-transparent border-b border-neutral-300 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-amber-500 transition-colors" />
      </div>
      <div>
        <label for="password" class="block text-xs font-medium uppercase tracking-widest text-neutral-500 mb-2">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Password" required
          class="w-full px-0 py-3 bg-transparent border-b border-neutral-300 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-amber-500 transition-colors" />
      </div>
      <button type="submit"
        class="w-full py-3 mt-2 bg-amber-500 text-white text-sm font-semibold tracking-wide uppercase hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:ring-offset-2 focus:ring-offset-white transition-colors cursor-pointer">
        Register
      </button>
    </form>
    <p class="mt-8 text-center text-sm text-neutral-600">Already have an account? <a routerLink="/login" class="text-amber-600 hover:text-amber-700 transition-colors">Login</a></p>
  </div>
</div>

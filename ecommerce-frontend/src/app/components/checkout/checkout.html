<div class="min-h-screen bg-white px-4 py-12">
  <div class="max-w-md mx-auto">
    @if (success()) {
      <div class="text-center">
        <h2 class="text-3xl font-extralight tracking-tight text-neutral-900 mb-2">Order Placed</h2>
        <p class="text-sm text-neutral-500 mb-8">Thank you for your purchase.</p>
        <button (click)="router.navigate(['/products'])"
          class="py-3 px-8 bg-amber-500 text-white text-sm font-semibold tracking-wide uppercase hover:bg-amber-600 transition-colors cursor-pointer">
          Continue Shopping
        </button>
      </div>
    } @else {
      <h2 class="text-3xl font-extralight tracking-tight text-neutral-900 mb-2">Checkout</h2>
      <p class="text-sm text-neutral-500 mb-10">Enter your shipping details.</p>

      @if (error()) {
        <div class="text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded-sm px-4 py-2.5 mb-6">{{ error() }}</div>
      }

      <form (ngSubmit)="placeOrder()" class="space-y-6">
        <div>
          <label for="address" class="block text-xs font-medium uppercase tracking-widest text-neutral-500 mb-2">Shipping Address</label>
          <textarea id="address" [(ngModel)]="shippingAddress" name="address" rows="3" placeholder="Full address" required
            class="w-full px-3 py-3 bg-transparent border border-neutral-300 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-amber-500 transition-colors resize-none"></textarea>
        </div>
        <button type="submit"
          class="w-full py-3 bg-amber-500 text-white text-sm font-semibold tracking-wide uppercase hover:bg-amber-600 transition-colors cursor-pointer">
          Place Order
        </button>
      </form>
    }
  </div>
</div>
